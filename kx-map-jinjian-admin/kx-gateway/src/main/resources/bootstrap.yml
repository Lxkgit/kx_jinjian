# Tomcat
server:
  port: @port@

# Spring
spring:
  application:
    # 应用名称
    name: kangxu-gateway-jinjian-dev
  profiles:
    # 环境配置
    active: @profileActive@
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: @nacosUrl@
        namespace: @namespace@
      config:
        # 配置中心地址
        server-addr: @nacosUrl@
        # 热加载
        refresh-enabled: true
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - @applicationFile@
        namespace: @namespace@
    sentinel:
      # 取消控制台懒加载
      eager: true
      transport:
        # 控制台地址
        dashboard: 127.0.0.1:8718
      # nacos配置持久化
      datasource:
        ds1:
          nacos:
            server-addr: 127.0.0.1:8848
            dataId: sentinel-ruoyi-gateway
            groupId: DEFAULT_GROUP
            data-type: json
            rule-type: gw-flow
